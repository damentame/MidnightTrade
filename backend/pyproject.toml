[project]
name = "ctrader-xau-lsfvg-bot"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.111",
  "uvicorn[standard]>=0.30",
  "sqlalchemy>=2.0",
  "psycopg2-binary>=2.9",
  "alembic>=1.13",
  "pydantic-settings>=2.3",
  "apscheduler>=3.10",
  "python-dateutil>=2.9",
  "httpx>=0.27",
  "pytest>=8.0"
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
